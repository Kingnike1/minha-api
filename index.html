<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    setTimeout(() => {
      window.location.href = "./public/";
    }, 5000);
  </script>
  <style>
    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: white;
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body class="flex flex-col justify-center items-center h-screen text-white text-center bg-gradient-to-r from-blue-600 to-cyan-400">

  <h1 class="text-3xl md:text-4xl font-bold mb-4">Bem-vindo ao nosso site!</h1>
  <p class="text-lg md:text-xl mb-6">Você será redirecionado para a seção da API em instantes...</p>

  <!-- Loading -->
  <div class="flex items-center gap-2 text-base md:text-lg">
    Carregando 
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <!-- Link alternativo -->
  <a href="./public/" 
     class="mt-6 px-5 py-2 bg-white text-blue-600 text-lg font-semibold rounded-lg shadow-md hover:bg-gray-200 transition">
     Clique aqui se não for redirecionado
  </a>

</body>
</html>
