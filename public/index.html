<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBusca – Descubra Tudo Sobre Seu Filme Favorito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Scrollbar do carrossel */
      .scrollbar-thin::-webkit-scrollbar {
        height: 8px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #1f2937; /* bg-gray-800 */
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #2563eb; /* blue-600 */
        border-radius: 4px;
      }

      /* Loading dots */
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }
      .dot {
        width: 8px;
        height: 8px;
        background-color: white;
        border-radius: 50%;
        animation: blink 1.4s infinite ease-in-out both;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center pb-16"
  >
    <!-- Título -->
    <header class="py-8 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-blue-400">
        🎬 CineBusca – Descubra Tudo Sobre Seu Filme Favorito
      </h1>
    </header>

    <!-- Logo após o header -->
    <div
      id="welcome-msg"
      class="text-lg text-blue-300 text-center animate-pulse mb-4"
    >
      Bem-vindo! Pesquise um filme e descubra curiosidades incríveis 🎥✨
    </div>

    <!-- Input Container -->
    <div class="relative w-full max-w-lg bg-gray-800 p-6 rounded-2xl shadow-lg">
      <label
        for="movie-title"
        class="block text-sm font-semibold mb-2 text-gray-300"
      >
        Digite o nome do filme:
      </label>
      <div class="flex gap-2">
        <input
          type="text"
          id="movie-title"
          placeholder="Ex: Inception"
          class="flex-1 px-4 py-2 rounded-lg border border-gray-600 bg-gray-700 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          autocomplete="off"
        />
        <button
          onclick="fetchMovie()"
          class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 transition text-white font-semibold shadow-md"
        >
          Buscar
        </button>
      </div>

      <!-- Container de sugestões -->
      <ul
        id="suggestions"
        class="absolute top-full left-0 w-full mt-1 bg-gray-700 text-gray-100 rounded-lg shadow-lg max-h-60 overflow-y-auto hidden z-50"
      >
        <!-- JS vai inserir li aqui -->
      </ul>

      <p class="text-red-400 text-sm mt-2 hidden" id="error-message"></p>

      <button
        onclick="showMovieTriviaModal()"
        class="mt-4 w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition text-white font-semibold shadow-md"
      >
        🎲 Curiosidade de Cinema
      </button>
    </div>

    <!-- Div de Filme / Flip Card -->
    <div id="movie" class="mt-8 max-w-3xl text-center px-4">
      <p class="text-gray-400 text-lg">
        Pesquise por filmes e obtenha informações detalhadas como sinopse,
        elenco, gênero e muito mais.
        <br />
        Exemplo:
        <span class="text-blue-400">"Inception"</span>,
        <span class="text-blue-400">"The Matrix"</span> ou
        <span class="text-blue-400">"Forrest Gump"</span>.
      </p>
    </div>

    <!-- Carrossel de Resultados -->
    <div id="carousel" class="mt-10 w-full max-w-6xl px-4 hidden">
      <h2 class="text-xl font-bold mb-4 text-blue-400">Filmes Relacionados</h2>
      <div
        class="flex gap-4 overflow-x-auto pb-4 scrollbar-thin scrollbar-thumb-blue-600 scrollbar-track-gray-800"
      >
        <!-- Filmes aparecem aqui via JS -->
      </div>
    </div>

    <!-- Tabela/Resultados -->
    <div id="tabela" class="tabela mt-10 w-full max-w-4xl px-4"></div>

    <!-- Script -->
    <script src="script.js"></script>
    <script>
      // Enter key listener no input
      document
        .getElementById("movie-title")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            fetchMovie();
          }
        });
    </script>
  </body>
</html>
